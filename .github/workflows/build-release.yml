name: Build & Release

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN is read-only by default, so creating a release returns
# "403 Resource not accessible by integration" without this.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install nsis -y

      - name: Build exe with PyInstaller
        run: python -m PyInstaller --onefile --windowed --name "LessToken" --icon assets\icon.ico --add-data "assets\icon.ico;assets" --add-data "assets\help;assets\help" main.py

      - name: Build installer with NSIS
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          makensis.exe installer.nsi

      - name: Compute installer checksum
        run: |
          $hash = (Get-FileHash lesstoken-setup.exe -Algorithm SHA256).Hash
          "$hash  lesstoken-setup.exe" | Out-File -Encoding ascii lesstoken-setup.exe.sha256
          Write-Host "SHA-256: $hash"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          gh release create $tag `
            dist/"LessToken.exe" `
            lesstoken-setup.exe `
            lesstoken-setup.exe.sha256 `
            --title "LessToken $tag" `
            --notes "Automated release build from GitHub Actions"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          gh release upload $tag dist/"LessToken.exe" lesstoken-setup.exe lesstoken-setup.exe.sha256 --clobber
