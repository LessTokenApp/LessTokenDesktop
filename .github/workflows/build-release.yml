name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install nsis -y

      - name: Build exe with PyInstaller
        run: python -m PyInstaller --onefile --windowed --name "Less Token" main.py

      - name: Build installer with NSIS
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          makensis.exe installer.nsi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          gh release create $tag `
            dist/"Less Token.exe" `
            lesstoken-setup.exe `
            --title "Less Token $tag" `
            --notes "Automated release build from GitHub Actions"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          gh release upload $tag dist/"Less Token.exe" lesstoken-setup.exe --clobber
