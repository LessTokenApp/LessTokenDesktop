[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clipboard-optimizer"
version = "1.0.4"
description = "Desktop clipboard assistant for text, images, and files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyperclip>=1.9.0", "Pillow>=10.0"]

[project.optional-dependencies]
ai = ["openai>=1.0", "anthropic>=0.17.0"]
providers = [
    "openai>=1.0",
    "anthropic>=0.17.0",
    "google-generativeai>=0.3.0",
    "ollama>=0.1.0",
    "tiktoken>=0.5.0"
]
files = ["pypdf>=4.0", "python-docx>=1.1"]
ocr = ["pytesseract>=0.3"]
windows = ["pywin32>=306"]
ui = ["PySide6>=6.6.0", "pynput>=1.7.6"]
dev = ["pytest>=8.0"]

[project.scripts]
ai-clipboard-optimizer = "aiclipboardoptimizer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
